<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REBUILD Sandbox</title>
<style>
  body,html{margin:0;padding:0;height:100%;overflow:hidden;background:#121316;color:#e8eaf0;
    font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
  #game{display:block}
  .panel{position:fixed;background:#121316dd;border:1px solid #2a2e38;padding:10px 14px}
  #roster{top:10px;left:10px;max-height:80vh;overflow-y:auto;min-width:280px}
  #roster h3{margin:0 0 6px;color:#ebc328;font-weight:normal;letter-spacing:.2em}
  .bot{padding:4px 6px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
  .bot:hover{background:#20232b}
  .bot.sel{background:#26282f;outline:1px solid #ebc328}
  .bot .num{color:#ebc328;width:56px}
  .bot .rating{margin-left:auto;color:#828692}
  .bot .arche{color:#828692;font-size:12px}
  #score{position:fixed;top:10px;right:14px;text-align:center;font-size:26px;letter-spacing:.15em}
  #score .b{color:#6aa5ff}#score .r{color:#ff6a6a}
  #clock{font-size:14px;color:#828692}
  #keys{position:fixed;bottom:8px;left:10px;color:#828692;font-size:12px;white-space:pre}
  #msg{position:fixed;top:45%;width:100%;text-align:center;color:#ebc328;font-size:20px;
    letter-spacing:.3em;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="roster" class="panel"><h3>ROBOTS</h3></div>
<div id="score"><span class="b" id="s-blue">0</span><span style="color:#828692">—</span><span class="r" id="s-red">0</span>
  <div id="clock"></div></div>
<div id="keys"></div>
<div id="msg"></div>

<script src="src/engine.js"></script>
<script src="src/mechanisms.js"></script>
<script src="src/robots.js"></script>
<script src="robots/official.js"></script>
<script src="robots/custom.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
